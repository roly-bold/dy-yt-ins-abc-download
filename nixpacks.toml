# Railway Nixpacks configuration for ClipGrab
# Next.js app with yt-dlp binary dependency

[phases.setup]
aptPackages = ["curl"]

[phases.install]
cmds = ["curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /usr/local/bin/yt-dlp && chmod +x /usr/local/bin/yt-dlp"]

[start]
cmd = "npx next start -p ${PORT:-3000}"
